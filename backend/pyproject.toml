[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "markdownify>=1.2.3",
    "openai>=3.48.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-ai>=2.66.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests requiring live database",
]
